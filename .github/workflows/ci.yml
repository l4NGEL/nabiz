name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Bağımlılıklar
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Birim testleri + kapsam
        run: pytest --cov=nabiz --cov-report=term-missing --cov-fail-under=80

      - name: Sentetik uçtan uca (manifest → split → sızıntı → parmak izi)
        run: |
          python 00_veri_indir.py --sentetik
          python 01_split_dogrula.py
          cp sonuclar/split-parmak-izleri.json /tmp/pi1.json
          python 01_split_dogrula.py
          diff /tmp/pi1.json sonuclar/split-parmak-izleri.json \
            || (echo "::error::split parmak izi iki koşu arasında değişti (determinizm ihlali)" && exit 1)

      - name: Öznitelik + model boru hattı (torch'suz → yalnız baseline)
        run: |
          python 02_oznitelik_cikar.py
          python 03_model_egit.py --strateji birim_disi --hizli
