# NABIZ Faz 5 — MQTT broker + merkezi toplayıcı, canlı doğrulama için.
#
#   docker compose up
#   python 07_protokol_demo.py                    # ayrı terminalde
#
# RB-03 (ağ kesintisi) testi:
#   docker compose stop mosquitto   # broker'ı düşür — yayıncı tamponlar
#   python 07_protokol_demo.py       # "ULAŞILAMADI", tamponlu > 0 görülür
#   docker compose start mosquitto  # tekrar başlat — backfill'i gözlemlemek için
#   python 07_protokol_demo.py       # bağlanır, tampon boşalır
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

  toplayici:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.11-slim
        WORKDIR /app
        COPY pyproject.toml README.md ./
        COPY src ./src
        RUN pip install --no-cache-dir -e ".[protokol]"
        CMD ["uvicorn", "nabiz.serving.toplayici:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8700"]
    ports:
      - "8700:8700"
    volumes:
      - nabiz-data:/app/data

  # C-MAPSS SQL veri hattı (09_rul_sql.py, serving/rul_api.py). YALNIZ yerel
  # geliştirme: şifre sabit bir test değeridir, gerçek ortamda kullanılmaz.
  # Yereldeki olası PostgreSQL ile çakışmasın diye 55432.
  #   docker compose up -d postgres
  #   set NABIZ_PG_DSN=postgresql://nabiz:nabiz_yerel@localhost:55432/nabiz
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nabiz
      POSTGRES_PASSWORD: nabiz_yerel
      POSTGRES_DB: nabiz
    ports:
      - "55432:5432"
    volumes:
      - nabiz-pg:/var/lib/postgresql/data

volumes:
  nabiz-data:
  nabiz-pg:
