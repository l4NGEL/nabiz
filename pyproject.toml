[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nabiz"
version = "0.0.0"
description = "Titreşim/akustik/telemetri ile uç kestirimci-bakım ve anomali tespiti"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3", "hypothesis>=6.90"]
data = ["dvc>=3.60"]
# Faz 2+ (ağır; ayrı kurulur): eğitim (torch) ve uç uyarlama (onnx/onnxruntime).
# torchaudio YOK — DSP tamamen numpy/scipy (dsp/features.py), torch yalnız model eğitiminde.
dl = ["torch>=2.1", "onnx>=1.15", "onnxruntime>=1.17", "mlflow>=2.10"]
# Faz 5: protokol (Protobuf/MQTT) + merkezi toplayıcı (FastAPI)
# C-MAPSS SQL veri hattı (09_rul_sql.py) — yalnız PostgreSQL sürücüsü; SQLite stdlib'de
sql = ["psycopg[binary]>=3.1"]
protokol = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "httpx>=0.27", "paho-mqtt>=2.1", "grpcio-tools>=1.60"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]  # protoc üretimi — biçim kurallarımıza tabi değil

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
